server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/powerbank_stations?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      # The schema is created by database/schema.sql. Hibernate must not change it.
      ddl-auto: none
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB

app:
  jwt:
    # Required. Set JWT_SECRET to a random string of at least 32 characters.
    secret: ${JWT_SECRET}
    ttl-minutes: 480
  cors:
    allowed-origins: http://localhost:3000,http://127.0.0.1:3000
  uploads:
    # Inspection photos are stored here, outside the web root. They are never served directly.
    dir: ${UPLOAD_DIR:./uploads}
    spring:
  profiles:
    active: local
