server:
  port: 8080

spring:
  datasource:
    # Local MySQL. run-local.ps1 sets DB_URL, DB_USER and DB_PASSWORD.
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 15000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}

app:
  jwt:
    # Required. At least 32 characters. run-local.ps1 sets JWT_SECRET.
    secret: ${JWT_SECRET}
    ttl-minutes: 480
  cors:
    allowed-origins: http://localhost:3000,http://127.0.0.1:3000
  uploads:
    dir: ${UPLOAD_DIR:./uploads}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:}
