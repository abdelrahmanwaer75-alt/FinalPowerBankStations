<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Set a new PowerBank Stations password.">
    <title>Choose new password | PowerBank Stations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="../../css/tokens.css">
    <link rel="stylesheet" href="../../css/auth.css">
    <link rel="stylesheet" href="../../css/auth-flow.css">
</head>

<body class="auth-page">
    <header class="auth-header"><a class="auth-brand" href="index.html"><span class="bolt">⚡</span> PowerBank
            Stations</a>
        <nav><a href="login.html">Sign in</a></nav>
    </header>
    <main class="auth-main">
        <section class="auth-card flow-card" aria-labelledby="reset-title">
            <div class="auth-telemetry"><span class="auth-chip"><span class="dot"></span> Account recovery</span><span
                    class="auth-code">EG-NODE // 094</span></div>
            <div class="auth-head">
                <div class="auth-icon" aria-hidden="true">⚿</div>
                <h1 id="reset-title">Choose a new password</h1>
                <p>Enter your recovery code and a strong new password.</p>
            </div>
            <form id="reset-form" class="flow-form" novalidate><label class="field"><span>Email or phone number</span>
                    <div class="input-wrap"><input id="identifier" autocomplete="username" maxlength="190" required>
                    </div>
                </label>
                <div><span class="field">Recovery code</span>
                    <div class="code-row" id="code-row" aria-label="Six-digit recovery code"></div>
                </div><label class="field"><span>New password</span>
                    <div class="input-wrap"><input id="new-password" type="password" autocomplete="new-password"
                            minlength="8" maxlength="72" required></div>
                </label><label class="field"><span>Confirm new password</span>
                    <div class="input-wrap"><input id="confirm-password" type="password" autocomplete="new-password"
                            minlength="8" maxlength="72" required></div>
                </label>
                <p id="reset-message" class="form-message" role="status" aria-live="polite"></p><button
                    class="btn-primary-auth" type="submit">Save new password</button>
                <div class="flow-actions"><a class="flow-link" href="forgot-password.html">Request another code</a><a
                        class="flow-link" href="login.html">Back to sign in</a></div>
            </form>
            <div class="auth-trust"><span>Passwords are hashed</span><span class="sep">•</span><span>Never stored in
                    plain text</span></div>
        </section>
    </main>
    <footer class="auth-footer"><span>© 2025 PowerBank Stations Network.</span><span><a
                href="index.html">Home</a></span></footer>
    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/common.js"></script>
    <script src="../../js/auth-flow.js"></script>
</body>

</html>
